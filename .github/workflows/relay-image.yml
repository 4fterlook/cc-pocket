name: relay-image

on:
  push:
    tags:
      - "relay-v*"

permissions:
  contents: read

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate relay image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#relay-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::relay image tags must use relay-vX.Y.Z; got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Test relay compatibility
        run: |
          bash scripts/check-relay-image-publish.sh
          ./gradlew :protocol:jvmTest :relay:test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push private relay image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64
          push: true
          tags: docker.io/4fterlook/cc-pocket-relay:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        run: |
          {
            echo "### Relay image"
            echo '```text'
            echo "docker.io/4fterlook/cc-pocket-relay:${{ steps.version.outputs.value }}"
            echo "docker.io/4fterlook/cc-pocket-relay@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
